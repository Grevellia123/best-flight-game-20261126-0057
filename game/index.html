<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Volcano Sky Courier — Make the best flight game</title>
<style>
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; background: #0a0e1e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* On-screen flight controls: real DOM buttons, so every action works by
     touch (52px targets, one pointer per button for multi-touch) and by
     mouse click. They sit clear of the canvas HUD bars, and clear of notches
     and gesture bars via the safe-area insets. */
  #touch-ui { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
  #touch-ui .btn-group { position: absolute; display: flex; gap: 10px; pointer-events: none; }
  #flight-btns { left: max(12px, env(safe-area-inset-left)); bottom: calc(max(96px, env(safe-area-inset-bottom) + 88px)); }
  #sys-btns { right: max(12px, env(safe-area-inset-right)); bottom: calc(max(64px, env(safe-area-inset-bottom) + 56px)); }
  .ctl {
    pointer-events: auto; min-width: 52px; min-height: 52px; padding: 0 12px;
    border-radius: 14px; border: 2px solid rgba(255, 210, 61, 0.85);
    background: rgba(12, 18, 38, 0.78); color: #fff6dd;
    font: bold 15px/1.1 sans-serif; touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer;
  }
  .ctl.round { min-width: 52px; width: 52px; padding: 0; font-size: 22px; border-radius: 50%; }
  .ctl.pressed, .ctl:active { background: #ffd23d; color: #1a1430; }
  /* Narrow phones: the four flight buttons wrap to a 2×2 grid so they can
     never run into the pause / mute buttons on the right. */
  @media (max-width: 560px) {
    #flight-btns { flex-wrap: wrap; max-width: 230px; }
    .ctl { min-width: 48px; min-height: 48px; font-size: 13px; padding: 0 8px; }
    .ctl.round { min-width: 48px; width: 48px; font-size: 20px; }
  }
  /* Landscape-first game: in portrait on a touch phone, ask to rotate. */
  #rotate-hint {
    position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top));
    transform: translateX(-50%); z-index: 6; display: none;
    background: rgba(12, 18, 38, 0.88); border: 1px solid rgba(255, 210, 61, 0.85);
    color: #fff6dd; font: bold 14px sans-serif; padding: 10px 16px; border-radius: 10px;
    text-align: center; pointer-events: none; white-space: nowrap;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: block; } }
  /* Screenshot scenes render the bare game: hide the DOM controls there. */
  body.shot-mode #touch-ui, body.shot-mode #rotate-hint { display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="Volcano Sky Courier: fly a seaplane through golden rings, pick up cargo and land it on the island strip"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="touch-ui" aria-label="Flight controls">
  <div class="btn-group" id="flight-btns">
    <button type="button" class="ctl" data-hold="throttleUp" aria-label="Throttle up">THR ▲</button>
    <button type="button" class="ctl" data-hold="throttleDown" aria-label="Throttle down">THR ▼</button>
    <button type="button" class="ctl" data-hold="up" aria-label="Climb">▲ CLIMB</button>
    <button type="button" class="ctl" data-hold="down" aria-label="Descend">▼ DIVE</button>
  </div>
  <div class="btn-group" id="sys-btns">
    <button type="button" class="ctl round" id="btn-pause" aria-label="Pause">⏸</button>
    <button type="button" class="ctl round" id="btn-mute" aria-label="Mute sound">🔊</button>
  </div>
</div>
<div id="rotate-hint">🔄 Rotate your phone — this flight is best in landscape</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
